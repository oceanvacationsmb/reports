    left:240px;
    right:0;

iframe{

<script>

function openAccessLink(url){

    const frame = document.getElementById("contentFrame");

    const cacheBreaker = "v=" + new Date().getTime();

    frame.removeAttribute("srcdoc");

    frame.src = "about:blank";

    setTimeout(function(){

        frame.src = url + (url.includes("?") ? "&" : "?") + cacheBreaker;

    },50);
}

function openNewTab(url){
    window.open(url,"_blank");
}

function handleMobileSelect(value){

    if(!value) return;

    if(value === "contact"){
        loadContactPage();
        return;
    }

    const type = value.split(":")[0];

    const url = value.substring(type.length + 1);

    if(type === "frame"){
        openAccessLink(url);
    }

    if(type === "new"){
        openNewTab(url);
    }
}

function updateClock(){

    const now = new Date();

    const date = now.toLocaleDateString(undefined,{
        weekday:'short',
        year:'numeric',
        month:'short',
        day:'numeric'
    });

    const time = now.toLocaleTimeString();

    document.getElementById("clock").innerHTML =
        date + " | " + time;
}
